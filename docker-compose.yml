services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    volumes:
      - sqlite_data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - mpaas
    depends_on:
      caddy:
        condition: service_healthy
    environment:
          PORT: ":${PORT:-8000}"
          DB_PATH: /data/mpaas.db
          CADDY_ADMIN_URL: http://caddy:2019
    ports:
      - "127.0.0.1:8000:8000"
    dns:
      - 1.1.1.1
      - 8.8.8.8

  caddy:
    container_name: caddy
    image: caddy:latest
    command:
      [
        "caddy",
        "run",
        "--config",
        "/etc/caddy/Caddyfile",
        "--adapter",
        "caddyfile",
      ]
    healthcheck:
        test: ["CMD", "curl", "-f", "http://localhost:2019/config/"]
        interval: 5s
        timeout: 3s
        retries: 10
    ports:
      - "127.0.0.1:80:80"
    volumes:
      - ./api/config/Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      - mpaas

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3000:80"
    networks:
      - mpaas
    depends_on:
      - api


volumes:
  sqlite_data:

networks:
  mpaas:
    name: mpaas
