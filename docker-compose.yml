services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    volumes:
      - sqlite_data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - mpaas
    depends_on:
      caddy:
        condition: service_started
    environment:
          PORT: ${PORT:-8000}
          DB_PATH: /data/mpaas.db
          CADDY_ADMIN_URL: http://caddy:2019
          # BUILDKIT_HOST: tcp://buildkitd:1234

    ports:
      - "8000:8000"

  # buildkitd:
  #   image: moby/buildkit:latest
  #   privileged: true
  #   command: --addr tcp://0.0.0.0:1234
  #   volumes:
  #     - buildkit_cache:/var/lib/buildkit
  #   dns:
  #     - 1.1.1.1
  #     - 8.8.8.8
  #   networks:
  #     - mpaas


  caddy:
    image: caddy:latest
    command:
      [
        "caddy",
        "run",
        "--config",
        "/etc/caddy/Caddyfile",
        "--adapter",
        "caddyfile",
      ]
    ports:
      - "80:80"
      - "2019:2019"
    volumes:
      - ./api/config/Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      - mpaas

  # client:
  #   build:
  #     context: ./client
  #   depends_on:
  #     server:
  #       condition: service_started
  #   ports:
  #     - "3000:80"
  #   networks:
  #     - mpaas

volumes:
  sqlite_data:
  caddy_data:
  caddy_config:
  buildkit_cache:

networks:
  mpaas:
    name: mpaas
